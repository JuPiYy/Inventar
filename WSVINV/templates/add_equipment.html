<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Neues Equipment</title>

</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white"><h5>Neuen Gegenstand anlegen</h5></div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Asset Tag</label>
                        <input type="text" name="AssetTag" class="form-control" placeholder="z.B. BOOT-001" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Modellname</label>
                        <input type="text" name="ModelName" class="form-control" placeholder="z.B. Lettmann Rocky" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Kategorie</label>
                        <select name="CategoryID" class="form-control">
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="StatusID" class="form-control">
                            {% for stat in statuses %}
                            <option value="{{ stat.id }}">{{ stat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Standort</label>
                        <select name="LocationID" class="form-control">
                            {% for loc in locations %}
                            <option value="{{ loc.id }}">{{ loc.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Kaufdatum</label>
                        <input type="date" name="PurchaseDate" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kaufpreis (€)</label>
                        <input type="number" name="PurchasePrice" class="form-control" step="0.01" placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Aktueller Wert (€)</label>
                        <input type="number" name="CurrentValue" class="form-control" step="0.01" placeholder="0.00">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Garantie (Monate)</label>
                        <input type="number" name="WarrantyMonths" class="form-control" placeholder="z.B. 24">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Anzahl / Bestand</label>
                        <input type="number" name="Quantity" class="form-control" value="{{ item.Quantity if item else 1 }}" min="1">
                        <small class="text-muted">Für Sammelgegenstände (z.B. Schrauben, Westen).</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Gekauft bei (Händler)</label>
                        <input type="text" name="Vendor" class="form-control" placeholder="z.B. Amazon, Bauhaus, Segelladen.de">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Bemerkungen</label>
                        <textarea name="Notes" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="image" class="form-label">Gegenstand-Foto</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*">
                    </div>

                    <hr>
                    <h6>Extra-Informationen</h6>
                    <div id="specs-container">
                        <div class="row mb-2 spec-row">
                            <div class="col-5"><input type="text" name="spec_key[]" class="form-control" placeholder="Eigenschaft (z.B. Farbe)"></div>
                            <div class="col-5"><input type="text" name="spec_value[]" class="form-control" placeholder="Wert (z.B. Blau)"></div>
                            <div class="col-2">
                                <button type="button" class="btn btn-outline-danger w-100" title="Zeile entfernen" aria-label="Entfernen" onclick="this.parentElement.parentElement.remove()">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-secondary mb-3" onclick="addSpecRow()">
                        <i class="bi bi-plus-circle"></i> Weiteres Detail
                    </button>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success">Speichern</button>
                        <a href="/" class="btn btn-link">Abbrechen</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>function addSpecRow() {
    const container = document.getElementById('specs-container');
    const row = document.createElement('div');
    row.className = 'row mb-2 spec-row';
    row.innerHTML = `
        <div class="col-5"><input type="text" name="spec_key[]" class="form-control" placeholder="Eigenschaft"></div>
        <div class="col-5"><input type="text" name="spec_value[]" class="form-control" placeholder="Wert"></div>
        <div class="col-2">
            <button type="button" class="btn btn-outline-danger w-100" title="Zeile entfernen" aria-label="Entfernen" onclick="this.parentElement.parentElement.remove()">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    `;
    container.appendChild(row);
}</script>
</body>
</html>
